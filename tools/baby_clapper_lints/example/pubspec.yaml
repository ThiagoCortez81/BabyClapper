name: baby_clapper_lints_example
description: >-
  Fixture package for baby_clapper_lints. Hosts files annotated with
  `// expect_lint:` comments so custom_lint can verify each project-local rule
  fires exactly where expected. Not published; not part of the app.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  get_it: ^9.2.1

dev_dependencies:
  custom_lint: ^0.8.0
  baby_clapper_lints:
    path: ../
